name: 🛡️ Threat Intelligence Pipeline

on:
  schedule:
    # 1x par jour à 06:00 UTC (auparavant toutes les 30 min — trop fréquent,
    # source du flot de mails d'échec).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

concurrency:
  group: threat-intelligence
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Map-bad-ip/requirements.txt

      - name: 🦈 Barracuda — Discord IP Alert
        continue-on-error: true
        env:
          BLOCKLIST_URL: "https://raw.githubusercontent.com/duggytuxy/Data-Shield_IPv4_Blocklist/refs/heads/main/prod_data-shield_ipv4_blocklist.txt"
          WEBHOOK_URL_IP: ${{ secrets.WEBHOOK_URL_IP }}
        run: |
          mkdir -p Bad-Ip/logs
          python Bad-Ip/barracuda.py

      - name: 🔍 Fetch IPs from blocklist
        continue-on-error: true
        env:
          RSS_FEED_URL: "https://raw.githubusercontent.com/duggytuxy/Data-Shield_IPv4_Blocklist/refs/heads/main/prod_data-shield_ipv4_blocklist.txt"
        run: python Map-bad-ip/src/fetch_ips.py

      - name: 🌍 Geolocate IPs
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_IPS_PER_RUN: "2000"
        run: python Map-bad-ip/src/geolocate.py

      - name: 📊 Aggregate data
        run: python Map-bad-ip/src/aggregate.py

      - name: 🗺️ Generate dashboard (index.html)
        run: python Map-bad-ip/src/visualizev2.py

      - name: 💾 Commit all changes (single push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: auto-update threat intelligence [skip ci]"
          file_pattern: >-
            Bad-Ip/logs/seen_ips.log
            Map-bad-ip/data/ips.csv
            Map-bad-ip/data/ips.json
            Map-bad-ip/data/geo_enriched.csv
            Map-bad-ip/data/agg_by_country.csv
            Map-bad-ip/data/top_countries.csv
            index.html

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,Bad-Ip,Map-bad-ip,Veillecyber,*.py,*.yml,*.txt,*.log'
